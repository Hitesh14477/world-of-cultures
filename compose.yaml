services:
  api:
    build:
      context: .
      target: backend
    env_file:
      - backend/.env
    environment:
      NODE_ENV: production
      TRUST_PROXY_HOPS: "1"
    expose:
      - "5001"
    restart: unless-stopped

  web:
    build:
      context: .
      target: frontend
    depends_on:
      - api
    ports:
      - "${WEB_HTTP_PORT:-80}:80"
      - "${WEB_HTTPS_PORT:-443}:443"
    volumes:
      - "${TLS_CERT_PATH:-./deploy/certs/fullchain.pem}:/etc/nginx/certs/fullchain.pem:ro"
      - "${TLS_KEY_PATH:-./deploy/certs/privkey.pem}:/etc/nginx/certs/privkey.pem:ro"
    restart: unless-stopped
